# Render blueprint for the blog CMS (Strapi in cms/), served at https://blog.devliqly.in
# Database: Neon Postgres. Images: Cloudflare R2. Values marked sync: false are entered in Render when the blueprint is applied.
services:
  - type: web
    name: devliqly-cms
    runtime: node
    plan: free
    region: singapore
    rootDir: cms
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /_health
    autoDeploy: true
    buildFilter:
      paths:
        - cms/**
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PUBLIC_URL
        value: https://blog.devliqly.in
      - key: IS_PROXIED
        value: "true"

      # Secrets: generated once by Render; changing them later signs everyone out
      - key: APP_KEYS
        generateValue: true
      - key: API_TOKEN_SALT
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: TRANSFER_TOKEN_SALT
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true

      # Neon: paste the direct (non-pooled) connection string
      - key: DATABASE_CLIENT
        value: postgres
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      # Let idle connections close so Neon can scale to zero
      - key: DATABASE_POOL_MIN
        value: "0"
      - key: DATABASE_POOL_MAX
        value: "5"

      # Cloudflare R2 bucket for uploaded images
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_BUCKET
        value: devliqly-blog
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_PUBLIC_URL
        value: https://media.devliqly.in

      # Vercel Deploy Hook URL: rebuilds www.devliqly.in when posts change
      - key: SITE_DEPLOY_HOOK
        sync: false

  # Devliqly Platform backend (FastAPI in platform/backend/), served at https://platform.devliqly.in
  - type: web
    name: devliqly-platform
    runtime: python
    plan: starter # A free instance sleeps, which would delay WhatsApp webhooks
    region: singapore
    rootDir: platform/backend
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: .venv/bin/alembic upgrade head && .venv/bin/uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips '*'
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: ENVIRONMENT
        value: production
      - key: PUBLIC_BASE_URL
        value: https://platform.devliqly.in
      - key: JWT_SECRET
        generateValue: true
      # Neon direct connection strings: see platform/README.md
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      # From the Meta app: see platform/README.md
      - key: WHATSAPP_LINE_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        generateValue: true
