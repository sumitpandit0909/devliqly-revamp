# Render blueprint for the blog CMS (Strapi in cms/), served at https://blog.devliqly.in
# Database: Neon Postgres. Images: Cloudinary. Values marked sync: false are entered in Render when the blueprint is applied.
services:
  - type: web
    name: devliqly-cms
    runtime: node
    plan: free
    region: singapore
    rootDir: cms
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /_health
    autoDeploy: true
    buildFilter:
      paths:
        - cms/**
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PUBLIC_URL
        value: https://blog.devliqly.in
      - key: IS_PROXIED
        value: "true"

      # Secrets: generated once by Render; changing them later signs everyone out
      - key: APP_KEYS
        generateValue: true
      - key: API_TOKEN_SALT
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: TRANSFER_TOKEN_SALT
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true

      # Neon: paste the direct (non-pooled) connection string
      - key: DATABASE_CLIENT
        value: postgres
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      # Let idle connections close so Neon can scale to zero
      - key: DATABASE_POOL_MIN
        value: "0"
      - key: DATABASE_POOL_MAX
        value: "5"

      - key: CLOUDINARY_NAME
        sync: false
      - key: CLOUDINARY_KEY
        sync: false
      - key: CLOUDINARY_SECRET
        sync: false

      # Vercel Deploy Hook URL: rebuilds www.devliqly.in when posts change
      - key: SITE_DEPLOY_HOOK
        sync: false
